<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ご応募ありがとうございました - Forcewin-ICT株式会社</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#eeebe1" />
<link rel="icon" type="image/png" href="/assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/styles.css" />
<style>
.thanks-wrap{min-height:calc(100vh - 260px);display:flex;align-items:center;justify-content:center;padding:170px 24px 90px}
.thanks-card{
  background:#fffdf6;color:#22380f;border-radius:14px;max-width:560px;text-align:center;
  padding:56px 44px;box-shadow:0 20px 60px rgba(0,0,0,.28);
}
.thanks-card .mark{
  width:64px;height:64px;border-radius:50%;background:#496534;color:#fff;
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:1.6rem;
}
.thanks-card h1{font-size:1.5rem;color:#2a4612;margin-bottom:14px}
.thanks-card p{font-size:.95rem;color:rgba(34,56,15,.75);margin-bottom:8px}
.thanks-card .btn{margin-top:26px;background:#496534;color:#fff;box-shadow:none}
.thanks-card .btn:hover{background:#3a5320}
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a href="/" class="brand" aria-label="Forcewin-ICT株式会社 ホーム">
      <img class="brand-logo" src="/assets/img/logo.png" alt="" aria-hidden="true" />
      <span class="brand-text">FORCEWIN-ICT</span>
    </a>
    <nav class="nav" aria-label="メインナビゲーション">
      <a href="/#about">会社概要</a>
      <a href="/#services">サービス</a>
      <a href="/#strengths">強み</a>
      <a href="/#clients">取引実績</a>
      <a href="/recruit/">採用情報</a>
      <a href="/#contact" class="nav-cta">お問い合わせ</a>
    </nav>
  </div>
</header>

<main class="thanks-wrap">
  <div class="thanks-card">
    <div class="mark">✓</div>
    <h1>ご応募ありがとうございました</h1>
    <p>応募内容を受け付けました。</p>
    <p>書類選考のうえ、数営業日以内に担当者よりメールでご連絡いたします。</p>
    <a href="/" class="btn btn-lg">トップページへ戻る</a>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="brand brand-footer">
      <img class="brand-logo brand-logo-sm" src="/assets/img/logo.png" alt="" aria-hidden="true" />
      <span class="brand-text">FORCEWIN-ICT</span>
    </div>
    <p class="copyright">© <span id="year"></span> Forcewin-ICT株式会社 All rights reserved.</p>
  </div>
</footer>

<script src="/assets/js/script.js"></script>
</body>
</html>
